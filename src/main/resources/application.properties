# ==========================================
# APPLICATION
# ==========================================

spring.application.name=scholarship-portal
server.port=${PORT:8080}
spring.main.banner-mode=off


# ==========================================
# NEON POSTGRESQL DATABASE
# ==========================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000


# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# ==========================================
# JWT
# ==========================================

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}


# ==========================================
# FILE UPLOAD
# ==========================================

app.upload-dir=${UPLOAD_DIR:uploads}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB


# ==========================================
# CORS
# ==========================================

app.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:3000}


# ==========================================
# ADMIN ACCOUNT
# ==========================================

app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}
app.admin.name=${ADMIN_NAME:Scholarship Admin}


# ==========================================
# GMAIL SMTP
# ==========================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


# ==========================================
# PASSWORD RECOVERY
# ==========================================

app.password-reset.otp-expiry-minutes=5
app.password-reset.resend-cooldown-seconds=60
app.password-reset.max-attempts=5
app.password-reset.captcha-expiry-minutes=3
app.password-reset.token-expiry-minutes=10


# ==========================================
# LOGGING
# ==========================================

logging.level.com.scholarship.portal=INFO

logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.org.apache.tomcat=WARN

logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF